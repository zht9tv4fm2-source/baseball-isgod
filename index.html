<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2b"><title>DIAMOND LIFE — 野球人生シミュレーション</title>
<style>
:root{--bg:#0a1020;--panel:#121e32;--panel2:#182842;--line:#2a3c59;--text:#f3f6fb;--muted:#a9b7cc;--gold:#f6c96a;--blue:#7ec8ff;--green:#8fe0b0;--red:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3150 0,#0a1020 55%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.65}.app{max-width:760px;margin:auto;padding:18px 14px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:800}.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:99px}.hero{border:1px solid #314663;border-radius:22px;padding:22px;background:linear-gradient(135deg,#1b3150dd,#101a2bee);box-shadow:0 18px 45px #0004;margin-bottom:14px}.eyebrow{font-size:11px;color:var(--gold);letter-spacing:.15em;font-weight:800}.hero h1{font-size:clamp(25px,7vw,38px);line-height:1.25;margin:8px 0}.hero p{color:#c0ccdc;margin:8px 0 0;font-size:14px}.panel{background:#111d30eF;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.section-title{font-size:13px;color:var(--gold);font-weight:800;letter-spacing:.06em;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#1a2940;border:1px solid #2a3d5b;border-radius:12px;padding:10px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:18px}.stat .bar{height:4px;background:#2d3d56;border-radius:9px;margin-top:7px;overflow:hidden}.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#68baff,#8fe0b0);border-radius:9px}.story{font-size:15px;line-height:1.95;white-space:pre-line}.story strong{color:var(--gold)}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.pill{font-size:11px;color:#d4dfef;background:#20324b;border:1px solid #334a69;border-radius:99px;padding:4px 9px}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;color:var(--text);background:linear-gradient(135deg,#1b2d46,#152238);border:1px solid #344a68;border-radius:13px;padding:13px 14px;font:inherit;cursor:pointer;transition:.15s}.choice:hover{border-color:var(--gold);transform:translateY(-1px)}.choice b{display:block;font-size:14px}.choice span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.choice:disabled{opacity:.55}.primary{border:0;border-radius:12px;background:linear-gradient(135deg,#f6d17d,#e9a943);color:#182238;font-weight:850;padding:13px 17px;font:inherit;width:100%;cursor:pointer}.secondary{border:1px solid var(--line);background:#17253a;color:var(--text);border-radius:11px;padding:10px 13px;font:inherit;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.record{padding:11px;border-radius:11px;background:#1a2940}.record small{display:block;color:var(--muted);font-size:11px}.record b{font-size:16px}.log{border-left:2px solid #395579;padding:0 0 15px 13px;margin-left:4px}.log:last-child{padding-bottom:0}.log small{color:var(--gold);font-size:11px}.log p{margin:4px 0 0;font-size:13px;color:#d1dbea}.footer{text-align:center;color:#70829c;font-size:11px;margin-top:24px}.notice{color:#f7d99a;background:#322b1d;border:1px solid #5a4a2c;padding:10px 12px;border-radius:12px;font-size:12px}@media(min-width:600px){.stats{grid-template-columns:repeat(6,minmax(0,1fr))}.hero{padding:28px}.app{padding-top:26px}}
</style></head><body><main class="app"><div class="top"><div class="brand">◆ DIAMOND LIFE</div><div class="tag">BASEBALL × LIFE SIM</div></div>
<section id="intro" class="hero"><div class="eyebrow">YOUR LIFE, YOUR LEGACY</div><h1>野球だけでは、<br>人生は決まらない。</h1><p>生まれ持った才能も、出会いも、運もランダム。選択を重ねて、少年時代から引退後までの物語をつくろう。</p><div class="meta"><span class="pill">完全ランダム能力</span><span class="pill">半年ごとの選択</span><span class="pill">NPB / MLB</span><span class="pill">恋愛・資産・引退後</span></div><button class="primary" onclick="newGame()">人生を始める</button></section>
<section id="game" class="hidden"><div class="hero"><div class="eyebrow" id="phase">人生の始まり</div><h1 id="headline">あなたの物語</h1><p id="subhead">選択が未来を変える。</p><div class="meta" id="badges"></div></div>
<div class="panel"><h2 class="section-title">PLAYER STATUS</h2><div class="stats" id="stats"></div></div>
<div class="panel"><h2 class="section-title" id="eventLabel">人生のイベント</h2><div class="story" id="story"></div><div class="meta" id="eventMeta"></div><div class="choices" id="choices"></div><div id="continueArea" class="hidden" style="margin-top:12px"><button class="primary" onclick="advance()">次の半年へ →</button></div></div>
<div class="panel"><h2 class="section-title">CAREER & FINANCES</h2><div class="record-grid" id="records"></div></div>
<div class="panel"><h2 class="section-title">人生の記録</h2><div id="timeline"></div></div>
<div class="row"><button class="secondary" onclick="saveGame()">セーブ</button><button class="secondary" onclick="loadGame()">ロード</button><button class="secondary" onclick="if(confirm('今の人生を終了して新しく始めますか？'))newGame()">最初から</button></div>
</section><div class="footer">選択は正解探しではなく、あなただけの人生をつくるためのもの。</div></main>
<script>
const $=id=>document.getElementById(id);let G=null, waiting=false;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[rand(0,a.length-1)];const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));const money=n=>n>=100000000?`${(n/100000000).toFixed(1)}億円`:n>=10000?`${(n/10000).toFixed(0)}万円`:`${Math.round(n).toLocaleString()}円`;
function newGame(){G={age:0,half:0,name:pick(['蓮','湊','悠真','大翔','蒼','陸','颯太','晴','一真','翔']),family:pick(['野球経験のある父の家庭','共働きで忙しい家庭','地元に根を張る家庭','経済的に余裕のある家庭','転勤の多い家庭','野球とは無縁の家庭']),talent:rand(20,95),effort:rand(25,90),health:rand(45,95),mental:rand(25,90),luck:rand(5,95),charisma:rand(20,90),skill:rand(1,8),position:pick(['投手','捕手','内野手','外野手']),team:'少年野球',league:'アマチュア',salary:0,assets:rand(0,300000),debt:0,partner:'なし',children:0,careerHits:0,careerHR:0,careerWins:0,injuries:0,championships:0,pro:false,retired:false,ending:false,history:[],lastEvent:null,choiceCount:0};G.talent=Math.round(G.talent);G.history.push({age:0,title:'生まれる',text:`${G.family}に生まれた。才能は${G.talent>=75?'かなり高い':G.talent>=50?'平均以上':'未知数'}。ただし、才能だけで未来が決まるわけではない。`});$('intro').classList.add('hidden');$('game').classList.remove('hidden');renderEvent(true);render();window.scrollTo(0,0)}
function stage(){let a=G.age; if(G.retired)return '引退後';if(a<6)return '幼少期';if(a<13)return '少年時代';if(a<16)return '中学時代';if(a<18)return '高校時代';if(a<22)return '進路の分岐点';if(a<27)return G.pro?'プロ野球・成長期':'野球人生の模索';if(a<34)return G.pro?'プロ野球・全盛期':'社会人としての人生';if(a<40)return 'キャリアの岐路';return 'ベテラン・引退後'}
function render(){if(!G)return;$('phase').textContent=`${G.age}歳 · ${stage()}`;$('headline').textContent=G.ending?'あなたの野球人生が終わった':`${G.name}の人生`;$('subhead').textContent=`${G.team} ／ ${G.position} ／ ${G.league}`;$('badges').innerHTML=[G.pro?'プロ契約':'アマチュア',G.partner!=='なし'?`パートナー：${G.partner}`:'独身',G.retired?'引退済み':`次の節目まで ${Math.max(0,40-G.age)}歳前後`].map(x=>`<span class="pill">${x}</span>`).join('');let stats=[['才能',G.talent],['努力',G.effort],['健康',G.health],['メンタル',G.mental],['運',G.luck],['人望',G.charisma]];$('stats').innerHTML=stats.map(([n,v])=>`<div class="stat"><small>${n}</small><strong>${v}</strong><div class="bar"><i style="width:${v}%"></i></div></div>`).join('');$('records').innerHTML=[['年俸',money(G.salary)],['総資産',money(G.assets-G.debt)],['通算本塁打',G.careerHR+'本'],['通算安打',G.careerHits+'本'],['通算勝利',G.careerWins+'勝'],['タイトル',G.championships+'回']].map(([a,b])=>`<div class="record"><small>${a}</small><b>${b}</b></div>`).join('');$('timeline').innerHTML=G.history.slice(-8).reverse().map(h=>`<div class="log"><small>${h.age}歳 · ${h.title}</small><p>${h.text}</p></div>`).join('')||'<p class="small">これから記録が刻まれます。</p>'}
function eventData(){let a=G.age;if(G.ending)return {title:'エピローグ',story:`${G.name}の物語は、ひとつの区切りを迎えた。成績も資産も人間関係も、選んだ道の積み重ねだ。野球を離れたあとも人生は続いていく。`,choices:[{t:'物語を振り返る',d:'これまでの記録を確認する',f:()=>{G.ending=false;G.retired=true;}}]};
if(a<6)return {title:'小さなきっかけ',story:`${G.name}、${a}歳。${G.family}で育つあなたの毎日は、まだ野球とは無関係かもしれない。ある日、近所の公園でボールが転がってきた。何気ない出会いが、人生の入口になる。`,choices:[{t:'ボールを投げ返す',d:'好奇心と運を大切にする',f:()=>{G.talent+=rand(0,3);G.charisma+=3;G.luck+=3;note('公園でボールを投げ返した。');}},{t:'家族と一緒に遊ぶ',d:'健康と心の安定を育てる',f:()=>{G.health+=5;G.mental+=4;note('家族との時間が心の土台になった。');}},{t:'別の遊びに夢中になる',d:'人生は野球だけではない',f:()=>{G.mental+=5;G.luck+=2;note('夢中になれるものを見つけた。');}}]};
if(a<13)return {title:'少年野球との出会い',story:`小学生になった${G.name}。同級生が野球チームに入るらしい。体験会に誘われたが、練習は週末の時間を使う。続けるなら、遊びや勉強とのバランスも考えなくてはならない。`,choices:[{t:'チームに入って練習する',d:'努力・技術が伸びやすい。疲労には注意',f:()=>{G.effort+=5;G.skill+=2;G.health-=rand(0,4);note('少年野球に入団。基礎を覚え始めた。');}},{t:'まずは週末だけ参加する',d:'無理せず楽しみながら続ける',f:()=>{G.mental+=4;G.health+=2;G.skill+=1;note('楽しさを優先し、野球を生活に取り入れた。');}},{t:'別の習い事を選ぶ',d:'視野と人間性が広がる',f:()=>{G.charisma+=5;G.mental+=3;note('野球以外の経験が視野を広げた。');}}]};
if(a<16)return {title:'成長期と仲間',story:`中学では周囲のレベルが一段上がる。${G.position}としての適性が見え始めたが、同じポジションに有望な選手がいる。競争を受け入れるか、自分の強みを磨くか。`,choices:[{t:'自主練習を増やす',d:'努力と技術が伸びる。健康に負担',f:()=>{G.effort+=7;G.skill+=3;G.health-=4;note('自主練習を重ね、基礎技術が向上。');}},{t:'コーチに強みを相談する',d:'人望と適性が伸びる',f:()=>{G.charisma+=4;G.skill+=2;G.mental+=3;note('指導者との対話で自分の強みが見えた。');}},{t:'仲間との関係を優先する',d:'メンタルと人望を育てる',f:()=>{G.charisma+=6;G.mental+=5;note('仲間との信頼関係が深まった。');}}]};
if(a<18)return {title:'高校最後の夏',story:`高校野球の夏が近づく。スカウトの噂もあるが、確約ではない。練習にすべてを賭けるか、勉強も続けるか。ここでの選択が、進路の幅を変える。`,choices:[{t:'野球にすべてを注ぐ',d:'評価される可能性が上がるが、ケガのリスク',f:()=>{G.effort+=8;G.skill+=4;G.health-=rand(2,8);if(Math.random()<.12){G.injuries++;G.health-=12;note('無理がたたり、ケガで練習を離れた。');}else note('厳しい練習を乗り越え、最後の夏へ。');}},{t:'勉強と野球を両立する',d:'進学の選択肢と安定を確保する',f:()=>{G.mental+=4;G.charisma+=2;G.assets+=50000;G.skill+=1;note('野球以外の進路も残す判断をした。');}},{t:'指導者に進路相談をする',d:'人脈と運が鍵になる',f:()=>{G.charisma+=5;G.luck+=5;G.skill+=2;note('紹介や推薦につながる人脈を得た。');}}]};
if(a<22)return {title:'人生を左右する進路',story:`卒業が近づき、進学・ドラフト・社会人野球などの選択が現実になる。プロへの道は実力だけでなく、タイミングや巡り合わせにも左右される。今の自分に賭けるか、時間をかけて成長するか。`,choices:[{t:'プロ志望届・ドラフトに挑む',d:'才能・技術・運が揃えばプロ入りの可能性',f:()=>{let chance=(G.talent+G.skill*3+G.effort+G.luck)/3.4;if(Math.random()*100<chance){G.pro=true;G.league='NPB';G.team=pick(['東北ブルーウェーブ','東京セントラルズ','大阪フェニックス','福岡ホークス','名古屋ドラゴンズ']);G.salary=rand(12000000,30000000);G.assets+=G.salary*.55;G.championships+=Math.random()<.15?1:0;note(`ドラフト指名。${G.team}と契約し、プロの世界へ。`)}else{G.team='大学・社会人野球';G.league='アマチュア';G.skill+=3;G.effort+=3;note('指名は届かなかった。別の舞台で実力を磨く決断をした。')}}},{t:'大学で4年間鍛える',d:'時間をかけて技術と人脈を育てる',f:()=>{G.age+=2;G.skill+=4;G.effort+=4;G.charisma+=3;G.assets-=Math.min(G.assets,rand(100000,500000));note('大学で経験を積み、野球と学業に取り組んだ。');}},{t:'社会人野球・仕事を選ぶ',d:'収入と生活の安定を優先する',f:()=>{G.team='社会人野球';G.league='社会人';G.salary=rand(3000000,5500000);G.assets+=G.salary*.5;G.skill+=2;G.mental+=4;note('働きながら野球を続ける道を選んだ。');}}]};
if(G.pro && a<35)return proEvent();if(G.pro && a<42)return veteranEvent();if(a<42)return amateurEvent();return postCareerEvent()}
function proEvent(){let a=G.age;return {title:pick(['一軍への壁','契約更改','勝負のシーズン','人生の転機','オフの過ごし方']),story:`${a}歳。${G.team}で迎えるシーズン。${G.talent>75?'天性の才能は注目されている。':'派手さはないが、積み上げた努力が武器になってきた。'}ただ、プロの世界では結果が契約と立場に直結する。野球以外の人生も、少しずつ形を持ち始める。`,choices:[{t:'トレーニングと技術改善に投資',d:'成績アップの期待。疲労・ケガに注意',f:()=>{G.skill+=rand(2,5);G.effort+=3;G.health-=rand(1,6);note('課題に向き合い、技術を磨いた。')}},{t:'休養とコンディションを最優先',d:'健康と長期的な活躍を守る',f:()=>{G.health+=8;G.mental+=4;note('休養を徹底し、シーズンを戦う土台を整えた。')}},{t:'人脈づくりと私生活を大切に',d:'人望・恋愛・将来の選択肢にプラス',f:()=>{G.charisma+=6;G.mental+=3;if(G.partner==='なし'&&Math.random()<.32){G.partner=pick(['学生時代の友人','スポーツ関係者','仕事を通じて出会った人']);note(`${G.partner}と交際を始めた。`)}else note('球場の外にも信頼できる人間関係ができた。')}}]}}
function veteranEvent(){return {title:'ベテランの選択',story:`${G.age}歳。身体の回復は若い頃より遅くなり、若手の台頭も感じる。現役にこだわるのか、次の人生を準備するのか。過去の実績だけでは、明日の居場所は保証されない。`,choices:[{t:'現役続行へ、身体を徹底管理',d:'健康と技術を整え、もう一度勝負',f:()=>{G.health+=5;G.skill+=2;G.effort+=2;note('身体と向き合い、現役続行を目指す。')}},{t:'指導者・解説など次の道を探る',d:'人望と資産を将来につなげる',f:()=>{G.charisma+=5;G.assets+=rand(500000,2000000);note('引退後の仕事につながる活動を始めた。')}},{t:'家族や大切な人との時間を増やす',d:'メンタルを整え、人生の優先順位を見直す',f:()=>{G.mental+=7;G.charisma+=2;if(G.partner!=='なし')G.children+=Math.random()<.25?1:0;note('人生で本当に大切にしたいものを考えた。')}}]}}
function amateurEvent(){return {title:'野球と仕事の両立',story:`${G.age}歳。プロ以外の舞台でも野球を続けている。仕事、生活費、練習時間。好きなことを続けるには現実との折り合いが必要だ。ここでの経験は、野球以外の人生にも残る。`,choices:[{t:'競技を続けるため努力を重ねる',d:'技術と体力を伸ばす',f:()=>{G.skill+=3;G.effort+=4;G.health-=2;note('仕事と野球を両立し、競技を続けた。')}},{t:'仕事のキャリアを優先する',d:'収入と資産の安定を図る',f:()=>{G.salary=Math.max(G.salary,rand(3500000,6500000));G.assets+=G.salary*.45;G.mental+=3;note('仕事で経験を積み、生活の安定を得た。')}},{t:'指導や地域野球に関わる',d:'人望と新しい役割を育てる',f:()=>{G.charisma+=7;G.mental+=4;note('後輩を支える立場になり、野球との関わり方が変わった。')}}]}}
function postCareerEvent(){return {title:'引退後の人生',story:`${G.age}歳。ユニフォームを脱いだあとも人生は続く。現役時代に得た経験、人とのつながり、蓄えた資産。それらをどう使うかは自分次第だ。`,choices:[{t:'野球の指導者として働く',d:'人望を活かして次世代を育てる',f:()=>{G.charisma+=4;G.assets+=rand(300000,1500000);note('指導者として、次の世代に経験を伝えた。')}},{t:'新しい仕事や事業に挑戦',d:'運と経験が成果を左右する',f:()=>{if(Math.random()<.55){let gain=rand(500000,4000000);G.assets+=gain;note(`新しい挑戦が実を結び、資産が${money(gain)}増えた。`)}else{let loss=Math.min(G.assets,rand(100000,1000000));G.assets-=loss;note(`挑戦は簡単ではなく、${money(loss)}の損失を経験した。`)}G.mental+=2;}},{t:'家族や趣味を中心に穏やかに暮らす',d:'健康と満足感を大切にする',f:()=>{G.health+=4;G.mental+=7;note('自分らしいペースで暮らしを楽しんだ。')}},{t:'人生の物語を締めくくる',d:'ここまでの歩みをエピローグに残す',f:()=>{G.ending=true;G.retired=true;note('人生の記録を振り返り、物語に区切りをつけた。')}}]}}
function note(text){G.history.push({age:G.age,title:G.lastEvent||'選択',text});}
function renderEvent(first=false){if(G.ending){G.lastEvent='エピローグ';}else G.lastEvent=eventData().title;let e=eventData();$('eventLabel').textContent=e.title;$('story').textContent=e.story;$('eventMeta').innerHTML=`<span class="pill">${G.age}歳</span><span class="pill">${G.position}</span><span class="pill">${G.pro?'プロ契約中':'契約・進路は未確定'}</span>`;$('choices').innerHTML='';e.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${i+1}. ${c.t}</b><span>${c.d}</span>`;b.onclick=()=>choose(c);$('choices').appendChild(b)});$('continueArea').classList.add('hidden');waiting=true;render()}
function choose(c){if(!waiting)return;waiting=false;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);c.f();G.choiceCount++;clampStats();if(G.pro&&!G.ending)simulateSeason();if(G.age>=42&&!G.retired){G.retired=true;G.team='引退後';G.league='引退';G.salary=0;G.history.push({age:G.age,title:'現役引退',text:'現役生活に区切りをつけた。これからは野球で培った経験を、次の人生に活かしていく。'});}if(G.age>=50)G.ending=true;render();$('continueArea').classList.remove('hidden');if(G.ending)$('continueArea').querySelector('button').textContent='人生の記録を確認 →'}
function simulateSeason(){let performance=G.skill*2+G.talent*.45+G.effort*.4+G.health*.25+rand(-30,30);if(G.health<30&&Math.random()<.45){G.injuries++;G.health-=8;note('ケガで出場機会が減った。焦らず回復に専念する必要がある。')}else{G.careerHits+=Math.max(0,Math.round((performance-70)/12+rand(0,10)));G.careerHR+=Math.max(0,Math.round((performance-100)/32+rand(0,3)));if(G.position==='投手')G.careerWins+=Math.max(0,Math.round((performance-70)/22+rand(0,3)));if(performance>155&&Math.random()<.35){G.championships++;note('活躍が評価され、タイトルを獲得した。')}G.health-=rand(1,5)}let base=G.salary||12000000;let raise=performance>145?rand(1.1,1.7):performance>110?rand(0.9,1.25):rand(0.55,0.95);G.salary=Math.max(3000000,Math.round(base*raise));let gross=G.salary;let tax=gross*.25;let living=gross*(G.partner!=='なし'?.25:.18);G.assets+=gross-tax-living;G.assets-=rand(100000,400000);if(G.assets<0){G.debt+=Math.abs(G.assets);G.assets=0}if(G.age>=29&&G.partner==='なし'&&Math.random()<.12)G.partner=pick(['学生時代の友人','スポーツ関係者','仕事を通じて出会った人']);if(G.partner!=='なし'&&G.children===0&&Math.random()<.12)G.children=1;}
function advance(){if(waiting)return;if(G.ending){render();return}G.half++;G.age+=G.age<18?1:G.age<22?1:1;if(G.age===18&&!G.pro){G.team='高校卒業';}if(G.age===22&&!G.pro&&G.league==='アマチュア'){G.team='社会人・独立リーグ';}if(G.age>=40&&G.pro&&Math.random()<.3){G.retired=true;G.team='引退後';G.league='引退';G.salary=0;G.history.push({age:G.age,title:'現役引退',text:'身体と向き合い、現役生活に区切りをつけた。'});}renderEvent();window.scrollTo({top:0,behavior:'smooth'})}
function clampStats(){['talent','effort','health','mental','luck','charisma'].forEach(k=>G[k]=clamp(G[k]));G.skill=clamp(G.skill,1,50);G.assets=Math.max(0,G.assets);G.salary=Math.max(0,G.salary)}function saveGame(){if(!G)return;localStorage.setItem('diamondLifeImproved',JSON.stringify(G));alert('この端末にセーブしました。')}function loadGame(){let s=localStorage.getItem('diamondLifeImproved');if(!s){alert('セーブデータがありません。');return}G=JSON.parse(s);$('intro').classList.add('hidden');$('game').classList.remove('hidden');renderEvent();render();window.scrollTo(0,0)}
</script></body></html>
